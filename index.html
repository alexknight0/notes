<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Notes</h1>
    <div id="account">
      <span id="user-email"></span>
      <button id="signin" type="button" hidden>Sign in with Google</button>
      <button id="signout" type="button" hidden>Sign out</button>
    </div>
  </header>

  <main>
    <p id="signed-out-msg" hidden>Sign in to see and edit your note.</p>
    <label for="note" class="visually-hidden">Note</label>
    <textarea id="note" placeholder="Write something…" hidden></textarea>
    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
