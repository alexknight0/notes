<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- interactive-widget=resizes-content: the on-screen keyboard shrinks the layout,
       so the bottom input bar sits above the keyboard instead of behind it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Notes</title>
  <meta name="theme-color" content="#1f6feb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="title-row">
      <h1 id="view-title">Notes</h1>
      <div id="account">
        <span id="user-email"></span>
        <button id="signin" type="button" hidden>Sign in with Google</button>
        <button id="signout" type="button" class="small" hidden>Sign out</button>
      </div>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </header>

  <p id="signed-out-msg" class="empty" hidden>Sign in to see your notes.</p>

  <!-- Each view = a scrolling area + an input dock. On phones the dock sits at the
       bottom (thumb reach); on wide screens with a mouse it moves to the top (style.css). -->
  <main id="app" hidden>
    <!-- 3. Scratch pad -->
    <section id="view-scratch" class="view" data-title="Scratch pad">
      <label for="scratch" class="visually-hidden">Scratch pad</label>
      <textarea id="scratch" placeholder="Type anything…"></textarea>
    </section>

    <!-- 1. Urgent / deadlines -->
    <section id="view-urgent" class="view" data-title="Urgent" hidden>
      <div class="scroll">
        <ul id="urgent-list" class="list"></ul>
        <details id="urgent-done-wrap" hidden>
          <summary>Done (<span id="urgent-done-count">0</span>)</summary>
          <ul id="urgent-done" class="list"></ul>
        </details>
      </div>
      <form class="dock" id="urgent-form" autocomplete="off">
        <div class="row">
          <label class="due-label">Due <input id="urgent-due" type="datetime-local"></label>
        </div>
        <div class="row">
          <input id="urgent-text" placeholder="e.g. dentist fri 3pm" aria-label="Urgent note" enterkeyhint="done">
          <button type="submit">Add</button>
        </div>
      </form>
    </section>

    <!-- 2.1. Long-term facts -->
    <section id="view-facts" class="view" data-title="Facts" hidden>
      <div class="scroll">
        <p id="search-status" class="hint"></p>
        <ul id="fact-list" class="list"></ul>
      </div>
      <form class="dock" id="fact-form" autocomplete="off">
        <input id="fact-search" type="search" placeholder="🔍 Search facts…" aria-label="Search facts" enterkeyhint="search">
        <div class="row" id="fact-image-row" hidden>
          <img id="fact-image-preview" class="thumb" alt="">
          <button id="fact-image-clear" type="button" class="small">Remove photo</button>
        </div>
        <div class="row">
          <label class="file-btn icon-btn" title="Add photo" aria-label="Add photo">📷<input id="fact-image" type="file" accept="image/*" hidden></label>
          <textarea id="fact-text" rows="1" placeholder="New fact, e.g. My height: 178 cm" aria-label="Fact"></textarea>
          <button type="submit">Add</button>
        </div>
      </form>
    </section>

    <!-- 2.2. Thoughts to revisit -->
    <section id="view-thoughts" class="view" data-title="Thoughts" hidden>
      <div class="scroll">
        <div class="list-head">
          <h2>To review</h2>
          <button id="thoughts-reviewed" type="button" class="small">Mark all reviewed</button>
        </div>
        <ul id="thought-new" class="list"></ul>
        <h2>Earlier</h2>
        <ul id="thought-old" class="list"></ul>
        <details id="thought-archived-wrap" hidden>
          <summary>Archived (<span id="thought-archived-count">0</span>)</summary>
          <ul id="thought-archived" class="list"></ul>
        </details>
      </div>
      <form class="dock" id="thought-form" autocomplete="off">
        <div class="row">
          <textarea id="thought-text" rows="1" placeholder="Something to think about later…" aria-label="Thought"></textarea>
          <button type="submit">Add</button>
        </div>
      </form>
    </section>
  </main>

  <nav id="tabs" hidden>
    <a href="#scratch" data-view="scratch"><span>✏️</span>Scratch</a>
    <a href="#urgent" data-view="urgent"><span>⏰</span>Urgent<b id="urgent-badge" hidden></b></a>
    <a href="#facts" data-view="facts"><span>📌</span>Facts</a>
    <a href="#thoughts" data-view="thoughts"><span>💭</span>Thoughts<b id="thought-badge" hidden></b></a>
  </nav>

  <dialog id="edit">
    <form method="dialog" id="edit-form">
      <label>Type
        <select id="edit-type">
          <option value="urgent">Urgent</option>
          <option value="fact">Fact</option>
          <option value="thought">Thought</option>
        </select>
      </label>
      <textarea id="edit-text" rows="5" aria-label="Text"></textarea>
      <label id="edit-due-wrap">Due <input id="edit-due" type="datetime-local"></label>
      <div id="edit-image-wrap">
        <img id="edit-image" alt="">
        <div class="row">
          <label class="file-btn">📷 Replace photo<input id="edit-image-file" type="file" accept="image/*" hidden></label>
          <button id="edit-image-remove" type="button" class="small">Remove photo</button>
        </div>
      </div>
      <div class="row">
        <button id="edit-delete" type="button" class="danger">Delete</button>
        <span class="spacer"></span>
        <button value="cancel" formnovalidate>Cancel</button>
        <button id="edit-save" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
