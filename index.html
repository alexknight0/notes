<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- interactive-widget=resizes-content: the on-screen keyboard shrinks the layout,
       so the bottom input bar sits above the keyboard instead of behind it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Notes</title>
  <meta name="theme-color" content="#1f6feb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="title-row">
      <a class="home-link" href="../home/" aria-label="Home page (all sites)" title="Home page (all sites)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h5v-5.5h3V20h5V9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <h1 id="view-title">Notes</h1>
      <button id="version" type="button" class="version" data-state="checking" aria-label="Checking for updates…" title="Checking for updates…"><i></i><span></span></button>
      <div id="account">
        <span id="user-email"></span>
        <button id="signin" type="button" hidden>Sign in with Google</button>
        <button id="signout" type="button" class="small" hidden>Sign out</button>
      </div>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </header>

  <!-- Shown until the app knows whether you're signed in, so a slow start (or Firebase never
       loading) isn't a blank page. The "taking a while" line appears after 10 s by CSS alone. -->
  <section id="boot" class="boot" role="status" aria-live="polite">
    <p><span class="boot-spin" aria-hidden="true"></span><span id="boot-text">Checking sign-in…</span></p>
    <p class="boot-slow">This is taking a while. <button type="button" onclick="location.reload()">Reload</button></p>
  </section>

  <p id="signed-out-msg" class="empty" hidden>Sign in to see your notes.</p>

  <!-- Each view = a scrolling area + an input dock. On phones the dock sits at the
       bottom (thumb reach); on wide screens with a mouse it moves to the top (style.css). -->
  <main id="app" hidden>
    <!-- 3. Scratch pad -->
    <section id="view-scratch" class="view" data-title="Scratch pad">
      <label for="scratch" class="visually-hidden">Scratch pad</label>
      <textarea id="scratch" placeholder="Type anything…"></textarea>
      <button id="scratch-clear" type="button" class="small" hidden>Clear</button>
    </section>

    <!-- 1. Tasks / deadlines -->
    <section id="view-tasks" class="view" data-title="Tasks" hidden>
      <div class="scroll">
        <ul id="task-list" class="list"></ul>
        <details id="task-done-wrap" hidden>
          <summary>Done (<span id="task-done-count">0</span>)</summary>
          <ul id="task-done" class="list"></ul>
        </details>
      </div>
      <form class="dock" id="task-form" autocomplete="off">
        <div class="row due-chips" role="group" aria-label="Due">
          <button type="button" class="chip" data-due="today">Today</button>
          <button type="button" class="chip" data-due="tomorrow">Tomorrow</button>
          <button type="button" class="chip" data-due="week">+1 week</button>
          <button type="button" class="chip" id="due-pick" data-due="custom">📅 <span>Pick</span></button>
          <input id="task-due" type="datetime-local" class="visually-hidden" tabindex="-1" aria-label="Due date and time">
        </div>
        <div class="row">
          <input id="task-text" placeholder="e.g. dentist fri 3pm" aria-label="Task" enterkeyhint="done">
          <button type="submit">Add</button>
        </div>
      </form>
    </section>

    <!-- Library: ideas, thoughts and facts share one bottom tab and switch here. -->
    <nav id="subtabs" class="segmented" aria-label="Library" hidden>
      <a href="#ideas" data-view="ideas">💡 Ideas</a>
      <a href="#thoughts" data-view="thoughts">💭 Thoughts<b id="thought-subbadge" hidden></b></a>
      <a href="#facts" data-view="facts">📌 Facts</a>
    </nav>

    <!-- 2.3. Ideas: like thoughts, but no review cycle -->
    <section id="view-ideas" class="view" data-title="Ideas" hidden>
      <div class="scroll">
        <div id="idea-filter" class="row tag-filter" role="group" aria-label="Filter by tag" hidden></div>
        <ul id="idea-list" class="list"></ul>
        <details id="idea-archived-wrap" hidden>
          <summary>Archived (<span id="idea-archived-count">0</span>)</summary>
          <ul id="idea-archived" class="list"></ul>
        </details>
      </div>
      <form class="dock" id="idea-form" autocomplete="off">
        <div class="row">
          <select id="idea-tag" aria-label="Tag for new ideas"></select>
        </div>
        <div class="row">
          <textarea id="idea-text" rows="1" placeholder="New idea…" aria-label="Idea"></textarea>
          <button type="submit">Add</button>
        </div>
      </form>
    </section>

    <!-- 2.1. Long-term facts -->
    <section id="view-facts" class="view" data-title="Facts" hidden>
      <div class="scroll">
        <p id="search-status" class="hint"></p>
        <ul id="fact-list" class="list"></ul>
      </div>
      <form class="dock" id="fact-form" autocomplete="off">
        <input id="fact-search" type="search" placeholder="🔍 Search facts…" aria-label="Search facts" enterkeyhint="search">
        <div class="row" id="fact-image-row" hidden>
          <img id="fact-image-preview" class="thumb" alt="">
          <button id="fact-image-clear" type="button" class="small">Remove photo</button>
        </div>
        <div class="row">
          <label class="file-btn icon-btn" title="Add photo" aria-label="Add photo">📷<input id="fact-image" type="file" accept="image/*" hidden></label>
          <textarea id="fact-text" rows="1" placeholder="New fact, e.g. My height: 178 cm" aria-label="Fact"></textarea>
          <button type="submit">Add</button>
        </div>
      </form>
    </section>

    <!-- 2.2. Thoughts to revisit -->
    <section id="view-thoughts" class="view" data-title="Thoughts" hidden>
      <div class="scroll">
        <div class="list-head">
          <h2>To review</h2>
          <button id="thoughts-reviewed" type="button" class="small">Mark all reviewed</button>
        </div>
        <ul id="thought-new" class="list"></ul>
        <h2>Earlier</h2>
        <ul id="thought-old" class="list"></ul>
        <details id="thought-archived-wrap" hidden>
          <summary>Archived (<span id="thought-archived-count">0</span>)</summary>
          <ul id="thought-archived" class="list"></ul>
        </details>
      </div>
      <form class="dock" id="thought-form" autocomplete="off">
        <div class="row">
          <textarea id="thought-text" rows="1" placeholder="Something to think about later…" aria-label="Thought"></textarea>
          <button type="submit">Add</button>
        </div>
      </form>
    </section>
  </main>

  <nav id="tabs" hidden>
    <a href="#ideas" id="library-tab" data-view="library"><span>📚</span>Library<b id="thought-badge" hidden></b></a>
    <a href="#scratch" data-view="scratch"><span>✏️</span>Scratch</a>
    <a href="#tasks" data-view="tasks"><span>⏰</span>Tasks<b id="task-badge" hidden></b></a>
  </nav>

  <dialog id="edit">
    <form method="dialog" id="edit-form">
      <label>Type
        <select id="edit-type">
          <option value="task">Task</option>
          <option value="idea">Idea</option>
          <option value="thought">Thought</option>
          <option value="fact">Fact</option>
        </select>
      </label>
      <textarea id="edit-text" rows="5" aria-label="Text"></textarea>
      <label id="edit-due-wrap">Due <input id="edit-due" type="datetime-local"></label>
      <div id="edit-tags-wrap" class="row">
        <span id="edit-tags" class="row"></span>
        <input id="edit-tag-input" list="tag-options" placeholder="🏷 Add tag" aria-label="Add tag" enterkeyhint="done">
        <datalist id="tag-options"></datalist>
      </div>
      <div id="edit-image-wrap">
        <img id="edit-image" alt="">
        <div class="row">
          <label class="file-btn"><span id="edit-image-label">📷 Replace photo</span><input id="edit-image-file" type="file" accept="image/*" hidden></label>
          <button id="edit-image-remove" type="button" class="small">Remove photo</button>
        </div>
      </div>
      <div class="row">
        <button id="edit-delete" type="button" class="danger">Delete</button>
        <span class="spacer"></span>
        <button value="cancel" formnovalidate>Cancel</button>
        <button id="edit-save" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
